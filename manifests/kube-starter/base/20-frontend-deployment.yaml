apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-starter-frontend
  namespace: kube-starter
  labels:
    app.kubernetes.io/name: kube-starter
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: kube-starter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-starter
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-starter
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: kube-starter
    spec:
      containers:
        - name: frontend
          image: kube-frontend:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: BACKEND_SERVICE_URL
              value: http://kube-starter-backend:3000
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
