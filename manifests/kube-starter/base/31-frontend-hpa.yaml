apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kube-starter-frontend
  namespace: kube-starter
  labels:
    app.kubernetes.io/name: kube-starter
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: kube-starter
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kube-starter-frontend
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
