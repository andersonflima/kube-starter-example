apiVersion: v1
kind: Service
metadata:
  name: kube-starter-backend
  namespace: kube-starter
  labels:
    app.kubernetes.io/name: kube-starter
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: kube-starter
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kube-starter
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 3000
      targetPort: http
