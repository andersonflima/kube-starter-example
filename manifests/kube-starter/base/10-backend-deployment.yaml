apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-starter-backend
  namespace: kube-starter
  labels:
    app.kubernetes.io/name: kube-starter
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: kube-starter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-starter
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-starter
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: kube-starter
    spec:
      containers:
        - name: backend
          image: kube-backend:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "3000"
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
