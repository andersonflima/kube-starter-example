apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-starter-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/andersonflima/kube-starter-example.git
    targetRevision: main
    path: argocd/applications
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
