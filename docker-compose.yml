services:
  backend:
    build:
      context: ./backend
    environment:
      PORT: "3000"
    ports:
      - "${BACKEND_PORT:-3000}:3000"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    environment:
      BACKEND_SERVICE_URL: http://backend:3000
    ports:
      - "${FRONTEND_PORT:-8080}:80"
