controller:
  kind: DaemonSet
  hostPort:
    enabled: true
  ingressClassResource:
    name: nginx
    enabled: true
    default: true
  ingressClass: nginx
  publishService:
    enabled: false
  service:
    type: ClusterIP
  nodeSelector:
    ingress-ready: "true"
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Equal
      effect: NoSchedule
    - key: node-role.kubernetes.io/master
      operator: Equal
      effect: NoSchedule
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
