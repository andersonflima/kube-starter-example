{{- if .Values.frontend.autoscaling.enabled }}
{{- if gt (.Values.frontend.autoscaling.minReplicas | int) (.Values.frontend.autoscaling.maxReplicas | int) }}
{{- fail "frontend.autoscaling.minReplicas must be less than or equal to frontend.autoscaling.maxReplicas" }}
{{- end }}
{{- if not (or .Values.frontend.autoscaling.targetCPUUtilizationPercentage .Values.frontend.autoscaling.targetMemoryUtilizationPercentage) }}
{{- fail "frontend.autoscaling requires at least one target metric: targetCPUUtilizationPercentage or targetMemoryUtilizationPercentage" }}
{{- end }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "kube-starter.frontendFullname" . }}
  labels:
    {{- include "kube-starter.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "kube-starter.frontendFullname" . }}
  minReplicas: {{ .Values.frontend.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.frontend.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.frontend.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.frontend.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.frontend.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.frontend.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
